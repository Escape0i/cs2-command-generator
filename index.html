<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 指令生成器</title>
<script>
/* 首帧前应用已保存的配色，避免闪回默认主题 */
(function(){
  try{
    var th = localStorage.getItem('cs2gen_theme') || 'qingye';
    document.documentElement.setAttribute('data-theme', th);
  }catch(e){ document.documentElement.setAttribute('data-theme','qingye'); }
})();
</script>
<style>
/* ================= 主题变量 ================= */
:root, html[data-theme="qingye"]{
  --bg:#060d0f; --bg2:#0a1518; --panel:#0d1a1e; --panel2:#122227;
  --border:#1c3339; --text:#e4f5f3; --dim:#7a9a99;
  --accent:#3fd0c0; --accent-dim:#1f7d74; --accent-soft:rgba(63,208,192,0.12);
  --glow:rgba(63,208,192,0.35); --green:#5fd68e; --red:#ff6b6b;
  --mono:Consolas,'JetBrains Mono','Cascadia Code',monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
html[data-theme="cs2"]{
  --bg:#0b0e13; --bg2:#10151d; --panel:#141921; --panel2:#1a212c;
  --border:#232c3a; --text:#e8e6e1; --dim:#8b93a1;
  --accent:#f2a33c; --accent-dim:#a9712a; --accent-soft:rgba(242,163,60,0.12);
  --glow:rgba(242,163,60,0.35); --green:#7bc96f; --red:#e0655a;
}
html[data-theme="ct"]{
  --bg:#080e18; --bg2:#0c1420; --panel:#0f1a28; --panel2:#152335;
  --border:#1e3348; --text:#e2eefb; --dim:#7f96b0;
  --accent:#5aa9e6; --accent-dim:#2d6ca3; --accent-soft:rgba(90,169,230,0.12);
  --glow:rgba(90,169,230,0.35); --green:#68d391; --red:#fc8181;
}
html[data-theme="t"]{
  --bg:#12100a; --bg2:#1a160d; --panel:#1e1a11; --panel2:#262217;
  --border:#3a3220; --text:#f5eeda; --dim:#a3946f;
  --accent:#e8b64c; --accent-dim:#95711f; --accent-soft:rgba(232,182,76,0.12);
  --glow:rgba(232,182,76,0.35); --green:#a3d977; --red:#e07a5f;
}
html[data-theme="neon"]{
  --bg:#0a0713; --bg2:#100b1e; --panel:#150f28; --panel2:#1d1533;
  --border:#2e2148; --text:#ece4ff; --dim:#9385b8;
  --accent:#b47aff; --accent-dim:#6f3fb0; --accent-soft:rgba(180,122,255,0.12);
  --glow:rgba(180,122,255,0.40); --green:#5ef2c0; --red:#ff6b8a;
}
html[data-theme="night"]{
  --bg:#080d0a; --bg2:#0c140f; --panel:#101a14; --panel2:#16241b;
  --border:#203426; --text:#e6f2e8; --dim:#84a08c;
  --accent:#57c07a; --accent-dim:#2e7347; --accent-soft:rgba(87,192,122,0.12);
  --glow:rgba(87,192,122,0.35); --green:#8ee06f; --red:#e57373;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
  min-height:100vh;position:relative;
  transition:background-color .5s var(--ease),color .35s var(--ease);
}
/* 顶部主题色氛围光 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 520px at 50% -8%,var(--accent-soft),transparent 72%);
}
/* 切换配色时的全局颜色过渡（只在切换瞬间生效，不影响日常 hover） */
body.theme-anim, body.theme-anim *{
  transition:background-color .5s var(--ease),border-color .5s var(--ease),
             color .4s var(--ease),box-shadow .5s var(--ease) !important;
}
/* ================= 启动动画 ================= */
#splash{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:spOut .45s var(--ease) 2.55s forwards;
}
#splash::before{
  content:'';position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:34px 34px;
}
.sp-icon{
  position:relative;width:108px;height:108px;border-radius:22px;overflow:hidden;
  margin-bottom:26px;animation:spIcon .85s var(--ease) .12s both;
}
.sp-icon img{
  width:100%;height:100%;display:block;border-radius:22px;
  box-shadow:0 0 44px -14px var(--glow),0 0 0 1px var(--accent-soft);
}
.sp-icon::after{
  content:'';position:absolute;top:0;left:-60%;width:55%;height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.5),transparent);
  animation:spSheen .92s var(--ease) .82s both;opacity:0;
}
.sp-title{
  font-size:20px;font-weight:600;color:var(--text);
  letter-spacing:.3em;text-indent:.3em;white-space:nowrap;
  animation:spTitle .9s var(--ease) .5s both;
}
.sp-line{
  width:150px;height:1px;margin-top:16px;transform-origin:center;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:spLine .85s var(--ease) .8s both;
}
.sp-by{
  margin-top:14px;font-size:10.5px;letter-spacing:.3em;text-indent:.3em;color:var(--dim);
  animation:spBy .7s var(--ease) 1.35s both;
}
@keyframes spIcon{
  from{opacity:0;transform:scale(.84) translateY(10px);filter:blur(12px);}
  to{opacity:1;transform:none;filter:blur(0);}
}
@keyframes spSheen{
  0%{left:-60%;opacity:0;}
  18%{opacity:.9;}
  100%{left:112%;opacity:0;}
}
@keyframes spTitle{
  from{opacity:0;letter-spacing:.95em;transform:translateY(9px);filter:blur(4px);}
  to{opacity:1;letter-spacing:.3em;transform:none;filter:blur(0);}
}
@keyframes spLine{from{transform:scaleX(0);opacity:0;}to{transform:scaleX(1);opacity:1;}}
@keyframes spBy{from{opacity:0;transform:translateY(5px);}to{opacity:.78;transform:none;}}
@keyframes spOut{0%{opacity:1;}100%{opacity:0;visibility:hidden;}}
/* 主界面入场 */
#app{animation:appIn .5s var(--ease) 2.52s both;}
@keyframes appIn{from{opacity:0;transform:translateY(10px) scale(.996);}to{opacity:1;transform:none;}}
/* 像素网格背景 */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:34px 34px;
  transition:opacity .4s var(--ease);
}
body>*{position:relative;z-index:1;}
/* ================= Header ================= */
header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 26px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,var(--accent-soft),transparent);
  transition:border-color .4s var(--ease);
}
.logo{display:flex;align-items:center;gap:14px;}
.logo-badge{
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  color:var(--bg);font-weight:800;font-size:19px;letter-spacing:1px;
  padding:8px 12px;border-radius:10px;flex:none;
  box-shadow:0 0 20px -6px var(--glow);
  animation:badgePulse 6s ease-in-out infinite;
}
@keyframes badgePulse{
  0%,100%{box-shadow:0 0 16px -8px var(--glow);}
  50%{box-shadow:0 0 26px -4px var(--glow);}
}
.logo h1{font-size:21px;font-weight:700;letter-spacing:1px;}
.logo p{font-size:11.5px;color:var(--dim);margin-top:2px;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.themes{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--border);border-radius:20px;}
.dot{
  width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;
  transition:all .2s var(--ease);cursor:pointer;
}
.dot:hover{transform:scale(1.18);}
.dot.on{border-color:var(--text);transform:scale(1.12);}
.dot[data-theme="qingye"]{background:#3fd0c0;}
.dot[data-theme="cs2"]{background:#f2a33c;}
.dot[data-theme="ct"]{background:#5aa9e6;}
.dot[data-theme="t"]{background:#e8b64c;}
.dot[data-theme="neon"]{background:#b47aff;}
.dot[data-theme="night"]{background:#57c07a;}
.search{
  width:180px;background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:9px;padding:8px 12px;font-size:12.5px;font-family:inherit;outline:none;
  transition:all .2s var(--ease);
}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);width:220px;}
.search::placeholder{color:var(--dim);}
.header-stats{display:flex;align-items:center;gap:12px;}
.header-stats span{color:var(--dim);font-size:12.5px;}
button{
  cursor:pointer;font-family:inherit;
  border:1px solid var(--border);background:var(--panel2);color:var(--text);
  border-radius:9px;padding:8px 15px;font-size:12.5px;
  transition:all .22s var(--ease);
}
button:hover{border-color:var(--accent);color:var(--accent);}
button.ghost{background:transparent;}
#langBtn{min-width:50px;font-weight:700;letter-spacing:1px;color:var(--accent);border-color:var(--accent-dim);}
/* ================= 模板 ================= */
.tpl-wrap{padding:20px 26px 2px;}
.sec-title{
  font-size:12px;color:var(--dim);letter-spacing:2.5px;
  margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:11px;}
.tpl{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  padding:13px 14px;display:flex;gap:11px;align-items:flex-start;
  cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;
}
.tpl::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);opacity:0;transition:opacity .25s var(--ease);
}
.tpl:hover{
  transform:translateY(-2px);border-color:var(--accent-dim);
  box-shadow:0 8px 24px -12px var(--glow);
}
.tpl:hover::before{opacity:1;}
.tpl-icon{font-size:22px;line-height:1.2;flex:none;}
.tpl-name{font-weight:700;font-size:13.5px;margin-bottom:3px;}
.tpl-desc{font-size:11px;color:var(--dim);line-height:1.5;}
/* ================= 主布局 ================= */
.layout{
  display:grid;grid-template-columns:1fr 430px;gap:18px;
  padding:20px 26px 40px;align-items:start;
}
/* ================= 模块 ================= */
.mod-list{min-width:0;}
.cat{
  font-size:12px;color:var(--accent);letter-spacing:3px;font-weight:600;
  margin:18px 0 10px;display:flex;align-items:center;gap:9px;
  cursor:pointer;user-select:none;transition:opacity .2s var(--ease);
}
.cat:first-child{margin-top:0;}
.cat:hover{opacity:.75;}
.cat .arrow{
  font-size:9px;transition:transform .28s var(--ease);display:inline-block;
  color:var(--accent-dim);
}
.cat.collapsed .arrow{transform:rotate(-90deg);}
.cat::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;}
.mod-grid.hidden{display:none;}
.mod{
  background:var(--panel);border:1px solid var(--border);border-radius:11px;
  cursor:pointer;transition:all .25s var(--ease);overflow:hidden;position:relative;
}
.mod:hover{
  transform:translateY(-2px);border-color:var(--accent-dim);
  box-shadow:0 10px 26px -16px var(--glow);
}
.mod.active{
  border-color:var(--accent);
  animation:breathe 4.5s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{box-shadow:0 0 0 1px var(--accent),0 0 12px -10px var(--glow);}
  50%{box-shadow:0 0 0 1px var(--accent),0 0 22px -6px var(--glow);}
}
.mod-head{display:flex;align-items:center;gap:11px;padding:13px 15px;}
.mod-check{
  width:19px;height:19px;flex:none;border:2px solid var(--border);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;font-weight:800;
  transition:all .25s var(--ease);
}
.mod.active .mod-check{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.mod-icon{font-size:19px;flex:none;}
.mod-info{min-width:0;}
.mod-name{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.mod-desc{font-size:11px;color:var(--dim);line-height:1.5;}
.mod-tip{
  font-size:10.5px;color:var(--accent-dim);line-height:1.5;margin-top:5px;
  padding-left:9px;border-left:2px solid var(--accent-soft);
}
.mod-params{
  display:none;border-top:1px dashed var(--border);
  margin:0 13px;padding:11px 0 13px;
}
.mod.active .mod-params{display:block;animation:fadeIn .25s var(--ease);}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.pr{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12px;color:var(--dim);margin-top:9px;
}
.pr:first-child{margin-top:0;}
.pr input[type=number],.pr input[type=text]{
  width:104px;background:var(--bg2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:12.5px;
  outline:none;transition:all .2s var(--ease);
}
.pr input[type=number]{text-align:right;}
.pr input[type=text]{text-align:center;}
.pr input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.pr em{font-style:normal;flex:1;font-size:10.5px;color:var(--dim);opacity:.8;line-height:1.4;}
.pr select{
  width:146px;background:var(--bg2);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 8px;font-size:12.5px;outline:none;cursor:pointer;
  transition:border .2s var(--ease);
}
.pr select:focus{border-color:var(--accent);}
.pr.chk{justify-content:flex-start;gap:8px;cursor:pointer;color:var(--text);}
.pr.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}
/* ================= 输出面板 ================= */
.out-panel{
  background:var(--panel);border:1px solid var(--border);border-radius:13px;
  padding:16px;position:sticky;top:16px;
  box-shadow:0 20px 50px -30px var(--glow);
}
.out-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.out-title{font-size:14.5px;font-weight:700;white-space:nowrap;}
.out-title span{
  font-size:11.5px;color:var(--accent);background:var(--accent-soft);
  padding:2px 9px;border-radius:20px;margin-left:7px;font-weight:600;
}
.out-actions{display:flex;gap:7px;}
#copyBtn{
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  border:none;color:var(--bg);font-weight:700;padding:9px 16px;border-radius:9px;
  position:relative;
}
#copyBtn:hover{filter:brightness(1.08);transform:translateY(-1px);}
#copyBtn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none;}
#copyBtn.done{background:linear-gradient(135deg,var(--green),var(--accent-dim));}
#copyBtn.done::after{
  content:'';position:absolute;inset:0;border-radius:9px;border:2px solid var(--green);
  animation:pulse .7s var(--ease) forwards;pointer-events:none;
}
@keyframes pulse{from{transform:scale(1);opacity:.9;}to{transform:scale(1.22);opacity:0;}}
#cfgBtn{padding:9px 13px;}
.global-opt{
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);
  margin-bottom:10px;cursor:pointer;user-select:none;
}
.global-opt input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}
.view-toggle{display:flex;gap:5px;margin-bottom:11px;}
.view-toggle button{
  flex:1;padding:6px 0;font-size:11.5px;border-radius:7px;background:transparent;color:var(--dim);
}
.view-toggle button.on{background:var(--panel2);color:var(--accent);border-color:var(--accent-dim);}
#outText{
  background:var(--bg);border:1px solid var(--border);border-radius:9px;
  padding:13px;font-family:var(--mono);font-size:12px;line-height:1.75;
  color:var(--green);white-space:pre-wrap;word-break:break-all;
  max-height:330px;overflow:auto;min-height:88px;
  transition:border-color .3s var(--ease);
}
#outText.empty{color:var(--dim);font-family:inherit;font-size:12.5px;}
#outText .grp{color:var(--accent);font-weight:700;}
.out-hint{font-size:11px;color:var(--dim);margin-top:9px;line-height:1.6;}
/* ================= 速查表 ================= */
.cheatsheet{margin-top:14px;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
.cheatsheet summary{
  padding:10px 13px;font-size:12.5px;cursor:pointer;color:var(--dim);
  user-select:none;background:var(--panel2);transition:color .2s var(--ease);
}
.cheatsheet summary:hover{color:var(--accent);}
.cheatsheet table{width:100%;border-collapse:collapse;font-size:11px;}
.cheatsheet td{padding:6px 11px;border-top:1px solid var(--border);vertical-align:top;}
.cheatsheet td:first-child{
  font-family:var(--mono);color:var(--accent);white-space:nowrap;width:40%;
}
.cheatsheet td:last-child{color:var(--dim);line-height:1.5;}
/* ================= 页脚 ================= */
footer{
  padding:16px 26px 28px;font-size:11px;color:var(--dim);opacity:.75;
  border-top:1px solid var(--border);line-height:1.8;
}
footer b{color:var(--accent);}
/* ================= 响应式 ================= */
@media (max-width:1080px){
  .layout{grid-template-columns:1fr;}
  .out-panel{position:static;}
}
@media (max-width:720px){
  .mod-grid{grid-template-columns:1fr;}
  header{padding:13px 15px;}
  .tpl-wrap,.layout{padding-left:15px;padding-right:15px;}
  .search{width:130px;}
  .search:focus{width:150px;}
}
</style>
</head>

<div id="app">
<header>
  <div class="logo">
    <span class="logo-badge">CS2</span>
    <div>
      <h1 data-i18n="h1">指令生成器</h1>
    </div>
  </div>
  <div class="toolbar">
    <div class="themes" id="themes" title="配色 / Theme"></div>
    <input id="searchBox" class="search" type="text" data-i18n-ph="searchPh" placeholder="搜索模块…">
    <button id="langBtn" title="Switch language / 切换语言">EN</button>
  </div>
  <div class="header-stats">
    <span id="selCount">已选 0 个模块</span>
    <button id="clearAll" class="ghost" data-i18n="clearAll">清空选择</button>
  </div>
</header>

<section class="tpl-wrap">
  <div class="sec-title" data-i18n="tplTitle">快速模板 · 一键载入</div>
  <div class="tpl-grid" id="tplGrid"></div>
</section>

<main class="layout">
  <section class="mod-list" id="modList"></section>

  <aside class="out-panel">
    <div class="out-head">
      <div class="out-title"><span data-i18n="outTitle">生成指令</span><span id="cmdCount"> 0 条</span></div>
      <div class="out-actions">
        <button id="copyBtn" data-i18n="copyBtn">📋 复制</button>
        <button id="cfgBtn" data-i18n="cfgBtn" title="下载 .cfg 文件">⬇ .cfg</button>
      </div>
    </div>
    <label class="global-opt"><input type="checkbox" id="autoWarmup" checked><span data-i18n="autoWarmup">默认附加：热身时长归零（mp_warmuptime 0）</span></label>

      <button data-view="compact" class="on" data-i18n="viewCompact">一行紧凑</button>
      <button data-view="lines" data-i18n="viewLines">逐条分行</button>
      <button data-view="grouped" data-i18n="viewGrouped">按模块分组</button>
    </div>
    <pre id="outText" class="empty" data-i18n="outEmpty">在左侧勾选模块、设置参数，这里会自动生成可以整段粘贴到游戏控制台的指令。</pre>
    <div class="out-hint" id="outHint"></div>

    <details class="cheatsheet">
      <summary data-i18n="refTitle">📖 指令速查表（点击展开）</summary>
      <table id="refTable"></table>
    </details>
  </aside>
</main>

<footer>
  <p data-i18n="footer1" data-i18n-html><b>使用方法：</b>设置 → 游戏 → 启用开发者控制台（~）；在练习房或自建服务器内按 ~ 打开控制台，将生成的指令整段粘贴（Ctrl + V）回车即可。</p>
  <p data-i18n="footer2" data-i18n-html><b>注意：</b>sv_cheats 相关指令仅在自建服务器、单人模式或练习房生效，官方匹配与竞技模式中无效；buddha、subclass_create 等指令可能受模式限制。</p>
</footer>

];
let theme = 'qingye';
try{ theme = localStorage.getItem('cs2gen_theme') || 'qingye'; }catch(e){}

function applyTheme(id, animate){
  if(animate){
    document.body.classList.add('theme-anim');
    setTimeout(()=>document.body.classList.remove('theme-anim'), 620);
  }
  theme = id;
  document.documentElement.setAttribute('data-theme', id);
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on', d.dataset.theme===id));
  try{ localStorage.setItem('cs2gen_theme', id); }catch(e){}
}

function renderThemes(){
  const box = document.getElementById('themes');
  box.innerHTML = THEMES.map(t =>
    '<button class="dot" data-theme="'+t.id+'" title="'+T(t.zh,t.en)+'"></button>'
  ).join('');
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on', d.dataset.theme===theme));
}

/* ================= 渲染 ================= */
function optText(o){ return (typeof o==='object') ? T(o.t, o.en) : o; }
function optVal(o){ return (typeof o==='object') ? o.v : o; }

function modParamsHtml(m){
  if(!m.params) return '';
  let p = '<div class="mod-params">';
  for(const pr of m.params){
    const id = 'p_'+m.id+'_'+pr.key;
    const label = T(pr.label, pr.enLabel);
    const hint = pr.hint ? T(pr.hint, pr.enHint) : '';
    if(pr.type==='select'){
      const opts = pr.options.map(o=>{
        const v = optVal(o);
        return '<option value="'+v+'"'+(String(v)===String(pr.def)?' selected':'')+'>'+optText(o)+'</option>';
      }).join('');
      p += '<label class="pr">'+label+'<select id="'+id+'" data-key="'+pr.key+'">'+opts+'</select></label>';
    }else if(pr.type==='checkbox'){
      p += '<label class="pr chk"><input type="checkbox" id="'+id+'" data-key="'+pr.key+'"'+(pr.def?' checked':'')+'><span>'+label+'</span></label>';
    }else if(pr.type==='text'){
      p += '<label class="pr">'+label+(hint?'<em>'+hint+'</em>':'')+'<input type="text" id="'+id+'" data-key="'+pr.key+'" value="'+pr.def+'"></label>';
    }else{
      const step = pr.step!==undefined ? ' step="'+pr.step+'"' : ' step="1"';
      p += '<label class="pr">'+label+'<input type="number" id="'+id+'" data-key="'+pr.key+'" min="'+(pr.min??0)+'" max="'+(pr.max??99999)+'"'+step+' value="'+pr.def+'"></label>';
    }
  }
  p += '</div>';
  return p;
}

function renderModules(){
  const list = document.getElementById('modList');
  const cats = [];
  for(const m of MODULES) if(!cats.includes(m.cat)) cats.push(m.cat);
  let html = '';
  for(const cat of cats){
    const first = MODULES.find(x=>x.cat===cat);
    html += '<div class="cat" data-cat="'+cat+'"><span class="arrow">▼</span>'+T(cat, first.enCat)+'</div>';
    html += '<div class="mod-grid" data-grid="'+cat+'">';
    for(const m of MODULES.filter(x=>x.cat===cat)){
      const search = (m.name+' '+m.enName+' '+m.desc+' '+m.enDesc+' '+cat+' '+first.enCat).toLowerCase();
      html += '<div class="mod" data-id="'+m.id+'" data-search="'+search.replace(/"/g,'')+'">'+
        '<div class="mod-head">'+
          '<span class="mod-check">✓</span>'+
          '<span class="mod-icon">'+m.icon+'</span>'+
          '<div class="mod-info">'+
            '<div class="mod-name">'+T(m.name, m.enName)+'</div>'+
            '<div class="mod-desc">'+T(m.desc, m.enDesc)+'</div>'+
            (m.tip?'<div class="mod-tip">💡 '+T(m.tip, m.enTip)+'</div>':'')+
          '</div>'+
        '</div>'+
        modParamsHtml(m)+
      '</div>';
    }
    html += '</div>';
  }
  list.innerHTML = html;
}

function renderTemplates(){
  document.getElementById('tplGrid').innerHTML = TEMPLATES.map((t,i)=>
    '<div class="tpl" data-tpl="'+i+'">'+
      '<span class="tpl-icon">'+t.icon+'</span>'+
      '<div><div class="tpl-name">'+T(t.name, t.enName)+'</div>'+
      '<div class="tpl-desc">'+T(t.desc, t.enDesc)+'</div></div>'+
    '</div>'
  ).join('');
}

function renderRefs(){
  document.getElementById('refTable').innerHTML = REFS.map(r=>
    '<tr><td>'+r[0]+'</td><td>'+T(r[1].zh, r[1].en)+'</td></tr>'
  ).join('');
}

/* ================= 参数 ================= */
function getParams(m){
  const p = {};
  for(const pr of (m.params||[])){
    const el = document.getElementById('p_'+m.id+'_'+pr.key);
    if(!el){ p[pr.key]=pr.def; continue; }
    if(pr.type==='checkbox')    p[pr.key]=el.checked;
    else if(pr.type==='number') p[pr.key]=clampNum(el, pr);
    else                        p[pr.key]=el.value;
  }
  return p;
}
function clampNum(el, pr){
  let v = parseFloat(el.value);
  if(isNaN(v)) v = pr.def;
  if(pr.min!==undefined && v < pr.min) v = pr.min;
  if(pr.max!==undefined && v > pr.max) v = pr.max;
  return v;
}
/* 快速模板用：勾选一个模块并写入参数（参数按 min/max 夹紧） */
function setModule(id, params){
  const mod = document.querySelector('.mod[data-id="'+id+'"]');
  if(!mod) return;
  mod.classList.add('active');
  if(!params) return;
  for(const key in params){
    const el = document.getElementById('p_'+id+'_'+key);
    if(!el) continue;
    const v = params[key];
    if(el.type==='checkbox'){
      el.checked = !!v;
    }else if(el.type==='number'){
      const pr = findParam(el.id);
      let n = parseFloat(v);
      if(isNaN(n)) n = pr ? pr.def : 0;
      if(pr){
        if(pr.min!==undefined && n < pr.min) n = pr.min;
        if(pr.max!==undefined && n > pr.max) n = pr.max;
      }
      el.value = n;
    }else{
      el.value = v;
    }
  }
}
function selectedModules(){
  return MODULES.filter(m=>{
    const el = document.querySelector('.mod[data-id="'+m.id+'"]');
    return el && el.classList.contains('active');
  });
}
function buildGrouped(){
  const groups = [];
  const mods = selectedModules();
  if(autoWarmup && mods.length) groups.push({name:T('默认','Defaults'), cmds:['mp_warmuptime 0']});
  for(const m of mods) groups.push({name:T(m.name, m.enName), cmds:m.build(getParams(m))});
  return groups;
}
function flatten(groups){
  const all = [];
  for(const g of groups) all.push(...g.cmds);
  return all;
}
/* 去重规则：同一条指令由「第一个产出它的模块」负责。
   - 跨模块重复（多个模块各带一条 sv_cheats 1）→ 去掉后面的；
   - 同一模块内部重复产出（bot_add_ct ×5）→ 视为有意设计，全部保留。 */
function dedupe(groups){
  const owner = new Map(), list = [], groupCmds = groups.map(()=>[]);
  let removed = 0;
  groups.forEach((g, gi)=>{
    for(const c of g.cmds){
      const k = String(c).trim().toLowerCase();
      if(owner.has(k)){
        if(owner.get(k) !== gi){ removed++; continue; }
      }else{
        owner.set(k, gi);
      }
      list.push(c); groupCmds[gi].push(c);
    }
  });
  return {list:list, groupCmds:groupCmds, removed:removed};
}

/* ================= 生成 ================= */
let currentView = 'compact';
let autoWarmup = true;
try{ const s = localStorage.getItem('cs2gen_warmup'); if(s!==null) autoWarmup = (s==='1'); }catch(e){}

function generate(){
  const groups = buildGrouped();
  const dd = dedupe(groups);
  const cmds = dd.list;
  const full = cmds.join(';');
  const out = document.getElementById('outText');

  if(!cmds.length){
    out.textContent = t('outEmpty2');
    out.classList.add('empty');
  }else{
    out.classList.remove('empty');
    if(currentView==='compact'){
      out.textContent = full;
    }else if(currentView==='lines'){
      out.textContent = cmds.join(';\n');
    }else{
      const parts = [];
      groups.forEach((g, gi)=>{
        const gc = dd.groupCmds[gi];
        if(!gc.length) return;
        parts.push('【'+g.name+'】\n'+gc.join(';\n'));
      });
      out.textContent = parts.join('\n\n');
    }
  }
  document.getElementById('cmdCount').textContent = tf('cmdCount',{n:cmds.length});
  document.getElementById('selCount').textContent = tf('selCount',{n:selectedModules().length});
  document.getElementById('outHint').textContent = cmds.length
    ? tf('outHint',{n:cmds.length, c:full.length, d:dd.removed})
    : '';
  const btn = document.getElementById('copyBtn');
  btn.disabled = !cmds.length;
  document.getElementById('cfgBtn').disabled = !cmds.length;
}

/* ================= 语言/主题应用 ================= */
function applyStaticLang(){
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : 'en';
  document.title = lang==='zh' ? 'CS2 指令生成器' : 'CS2 Command Generator';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(el.dataset.i18nHtml) el.innerHTML = t(k);
    else el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.getElementById('langBtn').textContent = lang==='zh' ? 'EN' : '中文';
}

/* ================= 状态快照 ================= */
function snapshotState(){
  const s = {};
  for(const m of MODULES){
    const el = document.querySelector('.mod[data-id="'+m.id+'"]');
    if(!el) continue;
    s[m.id] = {active:el.classList.contains('active'), params:getParams(m)};
  }
  return s;
}
function restoreState(s){
  for(const id in s){
    const mod = MODULES.find(m=>m.id===id);
    const el = document.querySelector('.mod[data-id="'+id+'"]');
    if(!el || !mod) continue;
    if(s[id].active) el.classList.add('active');
    for(const pr of (mod.params||[])){
      const input = document.getElementById('p_'+id+'_'+pr.key);
      if(!input || !(pr.key in s[id].params)) continue;
      if(pr.type==='checkbox') input.checked = !!s[id].params[pr.key];
      else input.value = s[id].params[pr.key];
    }
  }
}

/* ================= 事件 ================= */
const modList = document.getElementById('modList');

modList.addEventListener('click', e=>{
  const cat = e.target.closest('.cat');
  if(cat){
    cat.classList.toggle('collapsed');
    const grid = document.querySelector('.mod-grid[data-grid="'+cat.dataset.cat+'"]');
    if(grid) grid.classList.toggle('hidden', cat.classList.contains('collapsed'));
    return;
  }
  const mod = e.target.closest('.mod');
  if(!mod) return;
  if(e.target.closest('.mod-params')) return; // 参数区内不切换勾选
  mod.classList.toggle('active');
  generate();
});
modList.addEventListener('input', e=>{
  const el = e.target.closest('[data-key]');
  if(!el) return;
  if(el.type==='number'){
    const pr = findParam(el.id);
    if(pr && pr.min!==undefined && el.value!==''){
      const v = parseFloat(el.value);
      if(!isNaN(v)){
        if(v>pr.max) el.value = pr.max;
        if(v<pr.min) el.value = pr.min;
      }
    }
  }
  generate();
});
modList.addEventListener('change', generate);
modList.addEventListener('blur', e=>{
  const el = e.target.closest('[data-key]');
  if(el && el.type==='number'){
    const pr = findParam(el.id);
    if(pr){
      if(el.value==='' || isNaN(parseFloat(el.value))) el.value = pr.def;
      else el.value = clampNum(el, pr);
      generate();
    }
  }
}, true);

function findParam(id){
  const parts = id.split('_'); // p_<modid>_<key>
  const key = parts[parts.length-1];
  const modid = parts.slice(1, -1).join('_');
  const m = MODULES.find(x=>x.id===modid);
  return m ? (m.params||[]).find(x=>x.key===key) : null;
}

document.getElementById('clearAll').addEventListener('click', ()=>{
  document.querySelectorAll('.mod').forEach(m=>m.classList.remove('active'));
  generate();
});

document.getElementById('tplGrid').addEventListener('click', e=>{
  const tpl = e.target.closest('.tpl');
  if(!tpl) return;
  document.querySelectorAll('.mod').forEach(m=>m.classList.remove('active'));
  TEMPLATES[+tpl.dataset.tpl].set();
  if(searchBox.value){ searchBox.value = ''; applyFilter(); } // 清掉过滤，否则载入的模块可能被隐藏
  generate();
});

document.getElementById('viewToggle').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  currentView = b.dataset.view;
  document.querySelectorAll('#viewToggle button').forEach(x=>x.classList.toggle('on', x===b));
  generate();
});

document.getElementById('autoWarmup').addEventListener('change', e=>{
  autoWarmup = e.target.checked;
  try{ localStorage.setItem('cs2gen_warmup', autoWarmup?'1':'0'); }catch(err){}
  generate();
});

document.getElementById('themes').addEventListener('click', e=>{
  const d = e.target.closest('.dot');
  if(d) applyTheme(d.dataset.theme, true);
});

const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', applyFilter);

function applyFilter(){
  const q = searchBox.value.trim().toLowerCase();
  document.querySelectorAll('.mod').forEach(el=>{
    const hit = !q || (el.dataset.search||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
  document.querySelectorAll('.cat').forEach(cat=>{
    const grid = document.querySelector('.mod-grid[data-grid="'+cat.dataset.cat+'"]');
    if(!grid) return;
    const any = [...grid.querySelectorAll('.mod')].some(m=>m.style.display !== 'none');
    cat.style.display = any ? '' : 'none';
    if(any){
      grid.classList.remove('hidden');
      cat.classList.remove('collapsed');
    }else{
      grid.classList.add('hidden');
    }
  });
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  const snap = snapshotState();
  lang = lang==='zh' ? 'en' : 'zh';
  try{ localStorage.setItem('cs2gen_lang', lang); }catch(e){}
  applyStaticLang();
  renderThemes();
  renderModules();
  renderTemplates();
  renderRefs();
  restoreState(snap);
  applyFilter();
  generate();
  syncTooltipTitles();
});

function syncTooltipTitles(){
  document.getElementById('cfgBtn').title = lang==='zh' ? '下载 .cfg 文件' : 'Download .cfg file';
  document.getElementById('langBtn').title = 'Switch language / 切换语言';
  document.getElementById('themes').title = lang==='zh' ? '配色' : 'Theme';
}

/* ================= 复制 / 下载 ================= */
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async ()=>{
  const full = dedupe(buildGrouped()).list.join(';');
  if(!full) return;
  try{
    await navigator.clipboard.writeText(full);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = full; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  copyBtn.textContent = t('copied');
  copyBtn.classList.add('done');
  setTimeout(()=>{ copyBtn.textContent = t('copyBtn'); copyBtn.classList.remove('done'); },1700);
});

document.getElementById('cfgBtn').addEventListener('click', ()=>{
  const cmds = dedupe(buildGrouped()).list;
  if(!cmds.length) return;
  const content = cmds.join('\n') + '\n';
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'practice.cfg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='e'){
    e.preventDefault();
    if(!copyBtn.disabled) copyBtn.click();
  }
  if(e.key==='Escape' && document.activeElement === searchBox){
    searchBox.value = '';
    applyFilter();
  }
});

/* ================= 启动 ================= */
applyTheme(theme, false);
applyStaticLang();
renderThemes();
renderModules();
renderTemplates();
renderRefs();
syncTooltipTitles();
document.getElementById('autoWarmup').checked = autoWarmup;
generate();
</script>
