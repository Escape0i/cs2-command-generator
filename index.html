<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 指令生成器</title>
<script>
/* 首帧前应用已保存的配色，避免闪回默认主题 */
(function(){
  try{
    var th = localStorage.getItem('cs2gen_theme') || 'qingye';
    document.documentElement.setAttribute('data-theme', th);
  }catch(e){ document.documentElement.setAttribute('data-theme','qingye'); }
})();
</script>
<style>
/* ==========================================================================
   CS2 指令生成器 — 视觉系统 v2.1
   原则：分层靠明度与细描边，不靠发光；动效只做「因果反馈」，不做氛围装饰。
   ========================================================================== */

/* ---------- 主题令牌 ---------- */
:root, html[data-theme="qingye"]{
  --bg:#0a1011; --bg-deep:#070c0d;
  --s1:#0f1718; --s2:#131f21; --s3:#18282a;
  --line:#1e2c2e; --line-2:#26383a;
  --ink:#dceceb; --ink-2:#8ba4a3; --ink-3:#5d7574;
  --accent:#3fd0c0; --accent-ink:#04211f; --accent-weak:rgba(63,208,192,.10);
  --ok:#5fd68e; --err:#ff6b6b;
}
html[data-theme="cs2"]{
  --bg:#0d0e10; --bg-deep:#08090a;
  --s1:#141518; --s2:#191b1f; --s3:#212429;
  --line:#282a30; --line-2:#34373f;
  --ink:#e9e6e0; --ink-2:#9b968d; --ink-3:#6d6862;
  --accent:#f2a33c; --accent-ink:#1a1005; --accent-weak:rgba(242,163,60,.10);
  --ok:#7bc96f; --err:#e0655a;
}
html[data-theme="ct"]{
  --bg:#080d14; --bg-deep:#05090f;
  --s1:#0d1420; --s2:#121b29; --s3:#182335;
  --line:#1d2c40; --line-2:#27394f;
  --ink:#dde9f8; --ink-2:#8399b3; --ink-3:#5a7189;
  --accent:#5aa9e6; --accent-ink:#04121f; --accent-weak:rgba(90,169,230,.10);
  --ok:#68d391; --err:#fc8181;
}
html[data-theme="t"]{
  --bg:#100e09; --bg-deep:#0a0806;
  --s1:#181510; --s2:#1e1a14; --s3:#262119;
  --line:#322b1e; --line-2:#43392a;
  --ink:#f2e9d6; --ink-2:#a99a78; --ink-3:#7b6f57;
  --accent:#e8b64c; --accent-ink:#1a1204; --accent-weak:rgba(232,182,76,.10);
  --ok:#a3d977; --err:#e07a5f;
}
html[data-theme="neon"]{
  --bg:#0b0812; --bg-deep:#07050d;
  --s1:#120e1d; --s2:#171227; --s3:#1f1833;
  --line:#2a2140; --line-2:#392d55;
  --ink:#e8e0f8; --ink-2:#9a8dbb; --ink-3:#6e6390;
  --accent:#b47aff; --accent-ink:#12061f; --accent-weak:rgba(180,122,255,.10);
  --ok:#5ef2c0; --err:#ff6b8a;
}
html[data-theme="night"]{
  --bg:#080f0a; --bg-deep:#050a06;
  --s1:#0e1710; --s2:#122017; --s3:#17291d;
  --line:#1f3325; --line-2:#2a4431;
  --ink:#dfeedf; --ink-2:#87a191; --ink-3:#5c7464;
  --accent:#57c07a; --accent-ink:#04140a; --accent-weak:rgba(87,192,122,.10);
  --ok:#8ee06f; --err:#e57373;
}
:root{
  --mono:"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  --t-fast:120ms; --t:180ms; --t-slow:260ms;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:13px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  transition:background-color var(--t-slow) var(--ease), color var(--t) var(--ease);
  overflow-x:hidden;
}
/* 静态噪点：给纯色加一点纸感，替代彩色光晕 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.028;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)'/%3E%3C/svg%3E");
}
/* 极弱的顶部明度渐变，让页头浮起来一点点 */
body::after{
  content:'';position:fixed;inset:0 0 auto 0;height:220px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);
}
body>*{position:relative;z-index:1;}

body,body *{transition:background-color var(--t-slow) var(--ease),border-color var(--t-slow) var(--ease),color var(--t) var(--ease);}

::selection{background:var(--accent);color:var(--accent-ink);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

/* ---------- 启动页 ---------- */
#splash{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  animation:spOut .3s var(--ease) 1.45s forwards;
}
.sp-logo{
  width:80px;height:80px;display:block;border-radius:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.42);
  animation:spLogo .6s var(--ease) .04s both;
}
@keyframes spLogo{from{opacity:0;transform:translateY(8px) scale(.955);}to{opacity:1;transform:none;}}
.sp-title{
  margin-top:22px;font-size:15px;font-weight:600;letter-spacing:.22em;text-indent:.22em;
  color:var(--ink);animation:spFade .5s var(--ease) .42s both;
}
.sp-bar{
  width:132px;height:1px;background:var(--line);margin-top:20px;overflow:hidden;
  animation:spFade .4s var(--ease) .55s both;
}
.sp-bar i{
  display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;
  transform:scaleX(0);animation:spBar 1.05s var(--ease) .5s forwards;
}
.sp-by{
  margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ink-3);
  animation:spFade .5s var(--ease) .7s both;
}
@keyframes spMark{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes spDraw{to{stroke-dashoffset:0;}}
@keyframes spFade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
@keyframes spBar{to{transform:scaleX(1);}}
@keyframes spOut{to{opacity:0;visibility:hidden;}}

#app{zoom:var(--zoom,1.08);animation:appIn .34s var(--ease) 1.44s both;}
@keyframes appIn{from{opacity:0;}to{opacity:1;}}

/* ---------- 页头 ---------- */
header{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  height:58px;padding:0 26px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px) saturate(120%);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:2px;flex:none;}
.mark{
  width:26px;height:26px;flex:none;display:block;
  border:1px solid var(--line-2);border-radius:5px;
  display:grid;place-items:center;
  transition:border-color var(--t) var(--ease);
}
.mark svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.brand:hover .mark{border-color:var(--accent);}
.brand h1{font-size:13.5px;font-weight:600;letter-spacing:.04em;line-height:1.2;white-space:nowrap;}
.brand .ver{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.02em;margin-left:1px;}

.toolbar{display:flex;align-items:center;gap:8px;margin-left:auto;}
.themes{display:flex;align-items:center;gap:5px;padding-right:10px;margin-right:2px;border-right:1px solid var(--line);}
.dot{
  width:14px;height:14px;border-radius:3px;border:1px solid transparent;padding:0;flex:none;
  cursor:pointer;transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);
}
.dot:hover{transform:translateY(-1px);}
.dot.on{box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--ink-2);}
.dot[data-theme="qingye"]{background:#3fd0c0;}
.dot[data-theme="cs2"]{background:#f2a33c;}
.dot[data-theme="ct"]{background:#5aa9e6;}
.dot[data-theme="t"]{background:#e8b64c;}
.dot[data-theme="neon"]{background:#b47aff;}
.dot[data-theme="night"]{background:#57c07a;}

.search{
  width:188px;background:var(--s1);border:1px solid var(--line);color:var(--ink);
  border-radius:5px;padding:6px 10px;font-size:12px;font-family:inherit;outline:none;
  transition:border-color var(--t) var(--ease),background-color var(--t) var(--ease),width var(--t) var(--ease);
}
.search::placeholder{color:var(--ink-3);}
.search:hover{border-color:var(--line-2);}
.search:focus{border-color:var(--accent);background:var(--s2);width:210px;}

button{
  cursor:pointer;font-family:inherit;font-size:12px;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  border-radius:5px;padding:6px 11px;
  transition:color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease);
}
button:hover{color:var(--ink);border-color:var(--line-2);background:var(--s1);}
button:active{transform:translateY(.5px);}
button:disabled{opacity:.42;cursor:default;}
button:disabled:hover{background:transparent;border-color:var(--line);color:var(--ink-2);}
#langBtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-2);min-width:44px;}

.fs-wrap{
  position:relative;display:flex;align-items:center;gap:6px;
  height:29px;padding:0 8px 0 9px;
  border:1px solid var(--line);border-radius:5px;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease);
}
.fs-wrap:hover{border-color:var(--line-2);background:var(--s1);}
.fs-wrap::after{
  content:"\25BE";font-size:9px;color:var(--ink-3);margin-left:-4px;pointer-events:none;
}
.fs-wrap .fs-ico{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--ink-3);line-height:1;}
#fsSel{
  appearance:none;-webkit-appearance:none;border:none;background:transparent;outline:none;
  color:var(--ink-2);font-family:var(--sans);font-size:11.5px;line-height:1;
  padding:0 2px;cursor:pointer;
}
#fsSel:hover{color:var(--ink);}
#langBtn:hover{color:var(--accent);border-color:var(--accent);}

.header-stats{display:flex;align-items:center;gap:14px;flex:none;}
#selCount{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.02em;}
#selCount b{color:var(--ink);font-weight:600;}
#clearAll{border-color:transparent;background:transparent;padding:6px 4px;color:var(--ink-3);font-size:11.5px;}
#clearAll:hover{color:var(--ink);background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px;}

/* ---------- 区块标题 ---------- */
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:13.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--ink);margin-bottom:12px;
}
.sec-title .n{
  font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-3);
  border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:16px;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line);}

/* ---------- 模板：一体化面板，内部 1px 分隔 ---------- */
.tpl-wrap{padding:22px 26px 4px;max-width:1560px;margin:0 auto;}
.tpl-grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--s1);
}
.tpl{
  display:flex;gap:10px;align-items:flex-start;
  padding:11px 13px;background:transparent;border:none;border-radius:0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  cursor:pointer;position:relative;
  transition:background-color var(--t-fast) var(--ease);
}
.tpl:hover{background:var(--s2);}
.tpl:active{background:var(--s3);}
.tpl-idx{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1.75;flex:none;
  transition:color var(--t-fast) var(--ease);
}
.tpl:hover .tpl-idx{color:var(--accent);}
.tpl-body{min-width:0;}
.tpl-name{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink);}
.tpl-desc{font-size:12px;line-height:1.6;color:var(--ink-3);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.tpl:hover .tpl-desc{color:var(--ink-2);}

/* ---------- 主布局 ---------- */
.layout{
  display:grid;grid-template-columns:minmax(0,1fr) 404px;gap:24px;
  padding:26px 26px 48px;align-items:start;
  max-width:1560px;margin:0 auto;
}

/* ---------- 分类 ---------- */
.mod-list{min-width:0;}
.cat{
  display:flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-2);
  margin:20px 0 11px;padding:7px 11px;
  background:var(--s2);border:1px solid var(--line);border-radius:7px;
  cursor:pointer;user-select:none;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);
}
.cat:first-child{margin-top:0;}
.cat:hover{background:var(--s3);color:var(--ink);border-color:var(--line-2);}
.cat .dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--hue,var(--accent));}
.cat .arrow{
  width:10px;height:10px;flex:none;display:grid;place-items:center;order:3;
  transition:transform var(--t) var(--ease);color:var(--ink-3);
}
.cat .arrow svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cat.collapsed .arrow{transform:rotate(-90deg);}
.cat-count{
  font-family:var(--mono);font-size:10px;letter-spacing:0;color:var(--ink-3);
  border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:15px;margin-left:auto;
}

/* ---------- 模块：规格表式行 ---------- */
.mod-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(274px,1fr));gap:10px;
  align-items:stretch;
  border:none;background:none;overflow:visible;
}
.mod-grid.hidden{display:none;}
.mod{
  background:var(--s1);border:1px solid var(--line);border-radius:8px;
  cursor:pointer;position:relative;display:flex;flex-direction:column;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);
}
.mod:hover{background:var(--s2);border-color:var(--line-2);box-shadow:0 3px 14px rgba(0,0,0,.28);}
.mod.active{background:color-mix(in srgb,var(--accent) 7%,var(--s1));border-color:color-mix(in srgb,var(--accent) 48%,var(--line));}
.mod.active:hover{background:color-mix(in srgb,var(--accent) 9%,var(--s1));}
.mod-head{display:grid;grid-template-columns:26px minmax(0,1fr);grid-template-areas:"ico info";gap:10px;align-items:start;padding:12px 34px 0 12px;}
.mod-ico{grid-area:ico;}
.mod-info{grid-area:info;}
.mod-ico{
  width:26px;height:26px;border-radius:6px;flex:none;
  display:grid;place-items:center;
  background:color-mix(in srgb,var(--hue,var(--accent)) 15%,transparent);
  color:var(--hue,var(--accent));
}
.mod-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.mod-idx{display:none;}
.mod-preview{
  grid-column:1 / -1;margin-top:auto;
  margin:9px 12px 11px;padding-top:8px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;line-height:1.6;color:var(--ink-3);
  opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
  transition:color var(--t-fast) var(--ease),opacity var(--t-fast) var(--ease);
}
.mod:hover .mod-preview{opacity:1;color:var(--ink-2);}
.mod.active .mod-preview{opacity:1;color:var(--ink-2);}
.mod-info{min-width:0;}
.mod-name{font-size:13.5px;font-weight:600;line-height:1.4;color:var(--ink);}
.mod-desc{font-size:12px;line-height:1.6;color:var(--ink-2);margin-top:4px;}
.mod.active .mod-desc{color:var(--ink-2);}
.mod-tip{
  font-size:11.5px;line-height:1.55;color:var(--ink-2);margin-top:7px;
}
.mod-check{position:absolute;top:11px;right:11px;width:16px;height:16px;border-color:color-mix(in srgb,var(--ink-3) 55%,transparent);}
.mod:hover .mod-check{border-color:color-mix(in srgb,var(--ink-2) 70%,transparent);}
.mod-params{display:none;border-top:1px solid var(--line);margin:0 12px;padding:10px 0 12px;}

.mod.active .mod-params{display:block;animation:prIn var(--t) var(--ease);}
@keyframes prIn{from{opacity:0;transform:translateY(-3px);}to{opacity:1;transform:none;}}
.pr{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);margin-top:7px;}
.pr:first-child{margin-top:0;}
.pr>span,.pr>em{flex:1;min-width:0;}
.pr em{font-style:normal;font-size:10px;color:var(--ink-3);text-align:right;margin-left:auto;order:2;}
.pr input[type=number],.pr input[type=text],.pr select{
  background:var(--bg-deep);border:1px solid var(--line);color:var(--ink);
  border-radius:4px;padding:4px 7px;font-size:11.5px;font-family:var(--mono);outline:none;
  order:1;flex:none;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease);
}
.pr input[type=number]{width:78px;text-align:right;}
.pr input[type=text]{width:94px;text-align:center;}
.pr select{width:126px;font-family:inherit;cursor:pointer;}
.pr input[type=number],.pr input[type=text],.pr select{margin-left:auto;}
.pr input:hover,.pr select:hover{border-color:var(--line-2);}
.pr input:focus,.pr select:focus{border-color:var(--accent);background:var(--s3);}
.pr.chk{justify-content:flex-start;cursor:pointer;color:var(--ink-2);}
.pr.chk input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;order:0;margin:0;}

/* ---------- 输出面板 ---------- */
.out-panel{
  position:sticky;top:74px;
  border:1px solid var(--line);border-radius:8px;background:var(--s1);
  padding:14px;
}
.out-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.out-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink);}
.out-title .cnt{
  font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:0;
  color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));
  border-radius:3px;padding:0 5px;line-height:16px;min-width:34px;text-align:center;
  transition:background-color var(--t-fast) var(--ease);
}
.out-actions{display:flex;gap:6px;}
#copyBtn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent);border-color:var(--accent);color:var(--accent-ink);
  font-weight:600;padding:6px 12px;
}
#copyBtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
#copyBtn:hover{background:color-mix(in srgb,var(--accent) 88%,#fff);border-color:transparent;color:var(--accent-ink);}
#copyBtn.done{background:transparent;color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));}
#cfgBtn{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;}
#cfgBtn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

.global-opt{
  display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-3);
  margin-bottom:11px;cursor:pointer;user-select:none;
}
.global-opt:hover{color:var(--ink-2);}
.global-opt input{accent-color:var(--accent);width:12px;height:12px;cursor:pointer;}

/* 视图切换：滑动指示条 */
.view-toggle{position:relative;display:flex;gap:0;margin-bottom:11px;padding:2px;background:var(--bg-deep);border:1px solid var(--line);border-radius:5px;}
.view-toggle .seg-ind{
  position:absolute;top:2px;left:2px;bottom:2px;width:calc((100% - 4px)/3);border-radius:3px;
  background:var(--s3);transition:transform var(--t) var(--ease);
}
.view-toggle button{
  position:relative;z-index:1;flex:1;border:none;background:transparent;border-radius:3px;
  padding:5px 0;font-size:11px;color:var(--ink-3);
}
.view-toggle button:hover{background:transparent;color:var(--ink-2);}
.view-toggle button.on{color:var(--ink);}

#outText{
  display:block;margin:0;
  background:var(--bg-deep);border:1px solid var(--line);border-radius:5px;
  padding:11px 12px;font-family:var(--mono);font-size:12px;line-height:1.75;
  color:var(--ink);white-space:pre-wrap;word-break:break-all;
  max-height:336px;overflow:auto;min-height:104px;
  transition:border-color var(--t) var(--ease),background-color var(--t) var(--ease);
}
#outText.empty{color:var(--ink-3);font-family:var(--sans);font-size:11.5px;line-height:1.7;}
#outText .ln{display:block;animation:lnIn var(--t) var(--ease) both;}
.mod[data-enter]{animation:rowIn .34s var(--ease) both;}
@keyframes rowIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.mod.flash{animation:rowFlash .62s var(--ease);}
@keyframes rowFlash{0%{background:color-mix(in srgb,var(--accent) 17%,var(--s1));}100%{background:color-mix(in srgb,var(--accent) 6%,var(--s1));}}
.out-title .cnt.bump{animation:cntBump .32s var(--ease);}
@keyframes cntBump{0%{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}100%{}}
@keyframes lnIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}
#outText .grp{color:var(--accent);font-weight:600;}

.out-hint{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:8px;line-height:1.6;letter-spacing:.01em;}

/* 速查表 */
.cheatsheet{margin-top:12px;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
.cheatsheet summary{
  display:flex;align-items:center;gap:7px;padding:8px 11px;font-size:11px;cursor:pointer;
  color:var(--ink-3);user-select:none;list-style:none;
  transition:color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease);
}
.cheatsheet summary::-webkit-details-marker{display:none;}
.cheatsheet summary:hover{color:var(--ink);background:var(--s2);}
.cheatsheet summary .chev{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--t) var(--ease);}
.cheatsheet[open] summary .chev{transform:rotate(90deg);}
.cheatsheet table{width:100%;border-collapse:collapse;display:block;}
.cheatsheet tr{display:block;border-top:1px solid var(--line);padding:6px 11px;}
.cheatsheet td{display:block;border:none;padding:0;}
.cheatsheet td:first-child{font-family:var(--mono);font-size:10px;color:var(--ink-2);letter-spacing:.01em;}
.cheatsheet td:last-child{font-size:10.5px;color:var(--ink-3);line-height:1.5;margin-top:1px;}

/* ---------- 页脚 ---------- */
footer{
  border-top:1px solid var(--line);padding:18px 26px 26px;
  font-size:10.5px;color:var(--ink-3);line-height:1.75;max-width:1560px;margin:0 auto;
}
footer p+p{margin-top:5px;}
footer b{color:var(--ink-2);font-weight:500;}

/* ---------- 响应式 ---------- */
@media (max-width:1120px){
  .layout{grid-template-columns:minmax(0,1fr);}
  .out-panel{position:static;}
  .tpl-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width:760px){
  header{height:auto;padding:12px 15px;gap:10px;}
  .toolbar{margin-left:0;order:3;width:100%;}
  .search{flex:1;width:auto;}
  .search:focus{width:auto;}
  .mod-grid{grid-template-columns:1fr;}
  .tpl-wrap,.layout,footer{padding-left:15px;padding-right:15px;}
  .header-stats{order:2;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

</style>
</head>

<script>
/* ================= 主题 ================= */
const THEMES = [
  {id:'qingye', zh:'青夜', en:'Night Cyan'},
  {id:'cs2',    zh:'CS2 橙', en:'CS2 Orange'},
  {id:'ct',     zh:'CT 蓝', en:'CT Blue'},
  {id:'t',      zh:'T 琥珀', en:'T Amber'},
  {id:'neon',   zh:'霓虹紫', en:'Neon Purple'},
  {id:'night',  zh:'夜绿', en:'Night Green'},
];
let theme = 'qingye';
try{ theme = localStorage.getItem('cs2gen_theme') || 'qingye'; }catch(e){}

function applyTheme(id, animate){
  if(animate){
    document.body.classList.add('theme-anim');
    setTimeout(()=>document.body.classList.remove('theme-anim'), 620);
  }
  theme = id;
  document.documentElement.setAttribute('data-theme', id);
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on', d.dataset.theme===id));
  try{ localStorage.setItem('cs2gen_theme', id); }catch(e){}
}

function renderThemes(){
  const box = document.getElementById('themes');
  box.innerHTML = THEMES.map(t =>
    '<button class="dot" data-theme="'+t.id+'" title="'+T(t.zh,t.en)+'"></button>'
  ).join('');
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on', d.dataset.theme===theme));
}

/* ================= 语言 ================= */
let lang = 'zh';
try{ lang = localStorage.getItem('cs2gen_lang') || 'zh'; }catch(e){}

function t(key){ const e = I18N[key]; return e ? (e[lang] || e.zh) : key; }
function tf(key, args){
  let s = t(key);
  for(const k in args) s = s.split('{'+k+'}').join(args[k]);
  return s;
}
const T = (zh, en) => lang==='en' ? en : zh;

const I18N = {

function optText(o){ return (typeof o==='object') ? T(o.t, o.en) : o; }
function optVal(o){ return (typeof o==='object') ? o.v : o; }

function modParamsHtml(m){
  if(!m.params) return '';
  let p = '<div class="mod-params">';
  for(const pr of m.params){
    const id = 'p_'+m.id+'_'+pr.key;
    const label = T(pr.label, pr.enLabel);
    const hint = pr.hint ? T(pr.hint, pr.enHint) : '';
    if(pr.type==='select'){
      const opts = pr.options.map(o=>{
        const v = optVal(o);
        return '<option value="'+v+'"'+(String(v)===String(pr.def)?' selected':'')+'>'+optText(o)+'</option>';
      }).join('');
      p += '<label class="pr">'+label+'<select id="'+id+'" data-key="'+pr.key+'">'+opts+'</select></label>';
    }else if(pr.type==='checkbox'){
      p += '<label class="pr chk"><input type="checkbox" id="'+id+'" data-key="'+pr.key+'"'+(pr.def?' checked':'')+'><span>'+label+'</span></label>';
    }else if(pr.type==='text'){
      p += '<label class="pr">'+label+(hint?'<em>'+hint+'</em>':'')+'<input type="text" id="'+id+'" data-key="'+pr.key+'" value="'+pr.def+'"></label>';
    }else{
      const step = pr.step!==undefined ? ' step="'+pr.step+'"' : ' step="1"';
      p += '<label class="pr">'+label+'<input type="number" id="'+id+'" data-key="'+pr.key+'" min="'+(pr.min??0)+'" max="'+(pr.max??99999)+'"'+step+' value="'+pr.def+'"></label>';
    }
  }
  p += '</div>';
  return p;
}

/* ================= 参数 ================= */
function getParams(m){
  const p = {};
  for(const pr of (m.params||[])){
    const el = document.getElementById('p_'+m.id+'_'+pr.key);
    if(!el){ p[pr.key]=pr.def; continue; }
    if(pr.type==='checkbox')    p[pr.key]=el.checked;
    else if(pr.type==='number') p[pr.key]=clampNum(el, pr);
    else                        p[pr.key]=el.value;
  }
  return p;
}
function clampNum(el, pr){
  let v = parseFloat(el.value);
  if(isNaN(v)) v = pr.def;
  if(pr.min!==undefined && v < pr.min) v = pr.min;
  if(pr.max!==undefined && v > pr.max) v = pr.max;
  return v;
}
/* 快速模板用：勾选一个模块并写入参数（参数按 min/max 夹紧） */
function setModule(id, params){
  const mod = document.querySelector('.mod[data-id="'+id+'"]');
  if(!mod) return;
  mod.classList.add('active');
  if(!params) return;
  for(const key in params){
    const el = document.getElementById('p_'+id+'_'+key);
    if(!el) continue;
    const v = params[key];
    if(el.type==='checkbox'){
      el.checked = !!v;
    }else if(el.type==='number'){
      const pr = findParam(el.id);
      let n = parseFloat(v);
      if(isNaN(n)) n = pr ? pr.def : 0;
      if(pr){
        if(pr.min!==undefined && n < pr.min) n = pr.min;
        if(pr.max!==undefined && n > pr.max) n = pr.max;
      }
      el.value = n;
    }else{
      el.value = v;
    }
  }
}
function selectedModules(){
  return MODULES.filter(m=>{
    const el = document.querySelector('.mod[data-id="'+m.id+'"]');
    return el && el.classList.contains('active');
  });
}
function buildGrouped(){
  const groups = [];
  const mods = selectedModules();
  if(autoWarmup && mods.length) groups.push({name:T('默认','Defaults'), cmds:['mp_warmuptime 0']});
  for(const m of mods) groups.push({name:T(m.name, m.enName), cmds:m.build(getParams(m))});
  return groups;
}
function flatten(groups){
  const all = [];
  for(const g of groups) all.push(...g.cmds);
  return all;
}
/* 去重规则：同一条指令由「第一个产出它的模块」负责。
   - 跨模块重复（多个模块各带一条 sv_cheats 1）→ 去掉后面的；
   - 同一模块内部重复产出（bot_add_ct ×5）→ 视为有意设计，全部保留。 */
function dedupe(groups){
  const owner = new Map(), list = [], groupCmds = groups.map(()=>[]);
  let removed = 0;
  groups.forEach((g, gi)=>{
    for(const c of g.cmds){
      const k = String(c).trim().toLowerCase();
      if(owner.has(k)){
        if(owner.get(k) !== gi){ removed++; continue; }
      }else{
        owner.set(k, gi);
      }
      list.push(c); groupCmds[gi].push(c);
    }
  });
  return {list:list, groupCmds:groupCmds, removed:removed};
}

/* ================= 生成 ================= */
let currentView = 'compact';
let autoWarmup = true;
try{ const s = localStorage.getItem('cs2gen_warmup'); if(s!==null) autoWarmup = (s==='1'); }catch(e){}

/* 每行右侧的指令预览：让人一眼看到这个模块会输出什么 */
function syncPreviews(){
  for(const m of MODULES){
    const el = document.querySelector('.mod[data-id="'+m.id+'"] .mod-preview');
    if(!el) continue;
    let txt = '';
    try{ txt = (m.build(getParams(m))||[]).join('; '); }catch(e){ txt = ''; }
    const short = txt.length > 66 ? txt.slice(0,65) + '…' : txt;
    if(el.textContent !== short) el.textContent = short;
    el.title = txt;
  }
}

let lastCmdCount = -1;
const escHtml = str => String(str).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function generate(animate){
  const groups = buildGrouped();
  const dd = dedupe(groups);
  const cmds = dd.list;
  const full = cmds.join(';');
  const out = document.getElementById('outText');

  /* 行结构：{text, group?} */
  const lines = [];
  if(cmds.length){
    if(currentView==='compact'){
      lines.push({text:full});
    }else if(currentView==='lines'){
      cmds.forEach(c=>lines.push({text:c+';'}));
    }else{
      groups.forEach((g, gi)=>{
        const gc = dd.groupCmds[gi];
        if(!gc.length) return;
        lines.push({group:g.name});
        gc.forEach(c=>lines.push({text:c+';'}));
      });
    }
  }

  if(!cmds.length){
    out.classList.add('empty');
    out.textContent = t('outEmpty2');
  }else{
    out.classList.remove('empty');
    /* 指令条数变化时才做逐行入场，输入参数时不闪 */
    const play = animate !== false && lines.length !== lastCmdCount;
    out.innerHTML = lines.map((ln,i)=>{
      const delay = play ? ' style="animation-delay:'+Math.min(i*9,220)+'ms"' : '';
      const cls = (play ? 'ln ' : '') + (ln.group ? 'grp' : '');
      const txt = ln.group ? '【'+escHtml(ln.group)+'】' : escHtml(ln.text);
      return '<span class="'+cls+'"'+delay+'>'+txt+'</span>';
    }).join('');
  }
  lastCmdCount = lines.length;
  syncPreviews();

  const cntEl = document.getElementById('cmdCount');
  const cntTxt = String(cmds.length);
  if(cntEl.textContent !== cntTxt){
    cntEl.textContent = cntTxt;
    cntEl.classList.remove('bump');
    void cntEl.offsetWidth;
    cntEl.classList.add('bump');
  }
  document.getElementById('selCount').innerHTML = tf('selCount',{n:'<b>'+selectedModules().length+'</b>'});
  document.getElementById('outHint').textContent = cmds.length
    ? tf('outHint',{n:cmds.length, c:full.length, d:dd.removed})
    : '';
  const btn = document.getElementById('copyBtn');
  btn.disabled = !cmds.length;
  document.getElementById('cfgBtn').disabled = !cmds.length;
}

/* ================= 语言/主题应用 ================= */
function applyStaticLang(){
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : 'en';
  document.title = lang==='zh' ? 'CS2 指令生成器' : 'CS2 Command Generator';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(el.hasAttribute('data-i18n-html')) el.innerHTML = t(k);
    else el.textContent = t(k);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = t(el.dataset.i18nPh);
  });
  document.getElementById('langBtn').textContent = lang==='zh' ? 'EN' : '中文';
}

/* ================= 字号缩放 ================= */
(function(){
  const KEY = 'cs2cg.zoom';
  const STEPS = [1, 1.08, 1.16, 1.26];
  const DEF = 1.08;
  const sel = document.getElementById('fsSel');
  const root = document.documentElement;
  function apply(v){
    root.style.setProperty('--zoom', String(v));
    sel.value = String(v);
    try{ localStorage.setItem(KEY, String(v)); }catch(e){}
  }
  let saved = parseFloat(localStorage.getItem(KEY) || '');
  let cur = STEPS.indexOf(saved) >= 0 ? saved : DEF;
  apply(cur);
  sel.addEventListener('change', ()=>{
    const v = parseFloat(sel.value);
    if(STEPS.indexOf(v) >= 0) cur = v;
    apply(cur);
    if(typeof syncSeg === 'function') setTimeout(syncSeg, 30);
    if(typeof generate === 'function') generate(false);
  });
  function shift(d){
    const i = Math.max(0, Math.min(STEPS.length-1, STEPS.indexOf(cur) + d));
    cur = STEPS[i]; apply(cur);
  }
  document.addEventListener('keydown', e=>{
    if(!(e.ctrlKey || e.metaKey)) return;
    if(e.key === '=' || e.key === '+'){ e.preventDefault(); shift(1); }
    else if(e.key === '-'){ e.preventDefault(); shift(-1); }
    else if(e.key === '0'){ e.preventDefault(); cur = DEF; apply(cur); }
  });
})();

/* ================= 状态快照 ================= */
function snapshotState(){
  const s = {};
  for(const m of MODULES){
    const el = document.querySelector('.mod[data-id="'+m.id+'"]');
    if(!el) continue;
    s[m.id] = {active:el.classList.contains('active'), params:getParams(m)};
  }
  return s;
}
function restoreState(s){
  for(const id in s){
    const mod = MODULES.find(m=>m.id===id);
    const el = document.querySelector('.mod[data-id="'+id+'"]');
    if(!el || !mod) continue;
    if(s[id].active) el.classList.add('active');
    for(const pr of (mod.params||[])){
      const input = document.getElementById('p_'+id+'_'+pr.key);
      if(!input || !(pr.key in s[id].params)) continue;
      if(pr.type==='checkbox') input.checked = !!s[id].params[pr.key];
      else input.value = s[id].params[pr.key];
    }
  }
}

/* ================= 事件 ================= */
const modList = document.getElementById('modList');

/* 分类展开/收起的高度过渡（180ms，纯反馈，不做弹跳） */
function slideGrid(grid, open){
  if(open){
    grid.classList.remove('hidden');
    const h = grid.scrollHeight;
    grid.style.overflow = 'hidden';
    grid.style.height = '0px';
    grid.style.opacity = '0';
    void grid.offsetHeight;
    grid.style.transition = 'height .2s cubic-bezier(.2,0,0,1), opacity .16s cubic-bezier(.2,0,0,1)';
    grid.style.height = h + 'px';
    grid.style.opacity = '1';
    setTimeout(()=>{ grid.style.cssText = ''; }, 240);
  }else{
    const h = grid.scrollHeight;
    grid.style.overflow = 'hidden';
    grid.style.height = h + 'px';
    void grid.offsetHeight;
    grid.style.transition = 'height .2s cubic-bezier(.2,0,0,1), opacity .16s cubic-bezier(.2,0,0,1)';
    grid.style.height = '0px';
    grid.style.opacity = '0';
    setTimeout(()=>{ grid.style.cssText = ''; grid.classList.add('hidden'); }, 215);
  }
}

modList.addEventListener('click', e=>{
  const cat = e.target.closest('.cat');
  if(cat){
    const collapsed = cat.classList.toggle('collapsed');
    const grid = document.querySelector('.mod-grid[data-grid="'+cat.dataset.cat+'"]');
    if(grid) slideGrid(grid, !collapsed);
    return;
  }
  const mod = e.target.closest('.mod');
  if(!mod) return;
  if(e.target.closest('.mod-params')) return; // 参数区内不切换勾选
  mod.classList.toggle('active');
  generate(true);
});
modList.addEventListener('input', e=>{
  const el = e.target.closest('[data-key]');
  if(!el) return;
  if(el.type==='number'){
    const pr = findParam(el.id);
    if(pr && pr.min!==undefined && el.value!==''){
      const v = parseFloat(el.value);
      if(!isNaN(v)){
        if(v>pr.max) el.value = pr.max;
        if(v<pr.min) el.value = pr.min;
      }
    }
  }
  generate(false);
});
modList.addEventListener('change', ()=>generate(false));
modList.addEventListener('blur', e=>{
  const el = e.target.closest('[data-key]');
  if(el && el.type==='number'){
    const pr = findParam(el.id);
    if(pr){
      if(el.value==='' || isNaN(parseFloat(el.value))) el.value = pr.def;
      else el.value = clampNum(el, pr);
      generate(false);
    }
  }
}, true);

function findParam(id){
  const parts = id.split('_'); // p_<modid>_<key>
  const key = parts[parts.length-1];
  const modid = parts.slice(1, -1).join('_');
  const m = MODULES.find(x=>x.id===modid);
  return m ? (m.params||[]).find(x=>x.key===key) : null;
}

document.getElementById('clearAll').addEventListener('click', ()=>{
  document.querySelectorAll('.mod').forEach(m=>m.classList.remove('active'));
  generate(true);
});

document.getElementById('tplGrid').addEventListener('click', e=>{
  const tpl = e.target.closest('.tpl');
  if(!tpl) return;
  document.querySelectorAll('.mod').forEach(m=>m.classList.remove('active'));
  TEMPLATES[+tpl.dataset.tpl].set();
  if(searchBox.value){ searchBox.value = ''; applyFilter(); } // 清掉过滤，否则载入的模块可能被隐藏
  document.querySelectorAll('.mod.active').forEach((m,i)=>{
    setTimeout(()=>{ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }, i*24);
  });
  generate(true);
});

document.getElementById('viewToggle').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  currentView = b.dataset.view;
  document.querySelectorAll('#viewToggle button').forEach(x=>x.classList.toggle('on', x===b));
  syncSeg();
  generate(true);
});

function syncSeg(){
  const btns = [...document.querySelectorAll('#viewToggle button')];
  const i = Math.max(0, btns.findIndex(x=>x.classList.contains('on')));
  const ind = document.getElementById('segInd');
  if(ind) ind.style.transform = 'translateX(' + (i*100) + '%)';
}

document.getElementById('autoWarmup').addEventListener('change', e=>{
  autoWarmup = e.target.checked;
  try{ localStorage.setItem('cs2gen_warmup', autoWarmup?'1':'0'); }catch(err){}
  generate(true);
});

document.getElementById('themes').addEventListener('click', e=>{
  const d = e.target.closest('.dot');
  if(d) applyTheme(d.dataset.theme, true);
});

const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', applyFilter);

function applyFilter(){
  const q = searchBox.value.trim().toLowerCase();
  document.querySelectorAll('.mod').forEach(el=>{
    const hit = !q || (el.dataset.search||'').indexOf(q) >= 0;
    el.style.display = hit ? '' : 'none';
  });
  document.querySelectorAll('.cat').forEach(cat=>{
    const grid = document.querySelector('.mod-grid[data-grid="'+cat.dataset.cat+'"]');
    if(!grid) return;
    const any = [...grid.querySelectorAll('.mod')].some(m=>m.style.display !== 'none');
    cat.style.display = any ? '' : 'none';
    if(any){
      grid.style.cssText = '';
      grid.classList.remove('hidden');
      cat.classList.remove('collapsed');
    }else{
      grid.classList.add('hidden');
    }
  });
}

document.getElementById('langBtn').addEventListener('click', ()=>{
  const snap = snapshotState();
  lang = lang==='zh' ? 'en' : 'zh';
  try{ localStorage.setItem('cs2gen_lang', lang); }catch(e){}
  applyStaticLang();
  renderThemes();
  renderModules();
  renderTemplates();
  renderRefs();
  restoreState(snap);
  applyFilter();
  generate(true);
  syncTooltipTitles();
});

function syncTooltipTitles(){
  document.getElementById('cfgBtn').title = lang==='zh' ? '下载 .cfg 文件' : 'Download .cfg file';
  document.getElementById('langBtn').title = 'Switch language / 切换语言';
  document.getElementById('themes').title = lang==='zh' ? '配色' : 'Theme';
}

/* ================= 复制 / 下载 ================= */
const copyBtn = document.getElementById('copyBtn');
copyBtn.addEventListener('click', async ()=>{
  const full = dedupe(buildGrouped()).list.join(';');
  if(!full) return;
  try{
    await navigator.clipboard.writeText(full);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = full; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const label = copyBtn.querySelector('span');
  if(label) label.textContent = t('copied');
  copyBtn.classList.add('done');
  setTimeout(()=>{ if(label) label.textContent = t('copyBtn'); copyBtn.classList.remove('done'); },1600);
});

document.getElementById('cfgBtn').addEventListener('click', ()=>{
  const cmds = dedupe(buildGrouped()).list;
  if(!cmds.length) return;
  const content = cmds.join('\n') + '\n';
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'practice.cfg';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement !== searchBox && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); searchBox.focus(); return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='e'){
    e.preventDefault();
    if(!copyBtn.disabled) copyBtn.click();
  }
  if(e.key==='Escape' && document.activeElement === searchBox){
    searchBox.value = '';
    applyFilter();
  }
});

/* ================= 启动 ================= */
applyTheme(theme, false);
applyStaticLang();
renderThemes();
renderModules();
renderTemplates();
renderRefs();
syncTooltipTitles();
document.getElementById('autoWarmup').checked = autoWarmup;
syncSeg();
generate(true);
</script>
